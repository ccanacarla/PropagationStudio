<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="./css/main.css"><link rel="stylesheet" href="./css/layout.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#wrap{height:100%;display:grid;grid-template-rows:68px 1fr}.app-header{height:68px}.studio-layout{height:100%;display:block}.workspace{height:100%;padding:0}.canvas-card{height:100%}.canvas-stage{height:100%;padding:0}.technique-view{height:100%;width:100%;padding:16px 18px}</style></head><body class="app-visualization-mode"><div id="wrap"><header class="app-header"><div class="brand"><div class="brand-mark">P</div><div><h1>Propagation Studio</h1></div></div></header><main class="studio-layout visualization-workspace"><section class="workspace"><div class="canvas-card"><div class="canvas-stage"><div id="technique-view" class="technique-view" data-mode="glyph"></div></div></div></section></main></div><script type="module">
import {ComparativeViewer} from './js/visualization/comparative-viewer.js';
const rows=5, cols=10, regions=[]; for(let r=1;r<=rows;r++)for(let c=1;c<=cols;c++)regions.push({id:`R_${r}_${c}`,name:`R_${r}_${c}`,row:r,column:c});
const timeSteps=35, frameTimes=Array.from({length:timeSteps},(_,i)=>i+1), series={}; for(const reg of regions)series[reg.id]=frameTimes.map((_,i)=>Math.round(100*Math.abs(Math.sin((i+reg.row+reg.column)/8))));

const state={currentTimeStep:12,isPlaying:false}; const v=new ComparativeViewer(document.querySelector('#technique-view'),state,{}); v.mode='glyph'; v.renderGlyph(stimulus);
</script></body></html>
